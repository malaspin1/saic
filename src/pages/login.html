<!DOCTYPE html>
<html lang="pt_BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAIC - Login</title>
    <link rel="stylesheet" href="/src/style/style.css">
    <link rel="icon" href="../img/saic.png?v=2" type="image/png">

</head>

<body>

    <header>

        <h1 id="logo">saic</h1>
        <ul>
            <li>Início</li>
            <li><a class="list_links" href="loginUnidades.html">Saic - Unidades</a></li>
            <li><a class="list_links" href="loginEspecialistas.html">Saic - Especialistas</a></li>
            <li>Sobre</li>
        </ul>
        <div class="header_buttons_container">
            <button class="botao botao_entrar">Entrar</button>
            <button class="botao botao_criar">Criar conta</button>
        </div>
    </header>

    <form id="formulario_login" class="formulario">
        <h2 class="titulo_form">Login</h2>

        <label for="input_email" class="input_label">E-mail:</label>
        <input minlength="5" maxlength="150" class="input-texto" type="email" name="email" id="input_email"
            placeholder="Insira seu e-mail aqui" required>

        <label for="input_senha" class="input_label">Senha:</label>
        <input minlength="8" maxlength="50" class="input-texto" type="password" name="senha" id="input_senha"
            placeholder="Digite sua senha" required>
        <a class="link_form" href="cadastro.html">Não tem conta? <strong>Clique aqui</strong> para criar</a>
        <br>
        <input id="lembrardemim" type="checkbox" class="checkBox">
        <label for="lembrardemim" class="checkbox_label">Lembre de mim</label>
        <br>
        <button type="submit" class="buttonConfirmar">Confirmar</button>
    </form>

    <script>
        document
            .getElementById("formulario_login")
            .addEventListener("submit", function (event) {
                event.preventDefault();

                alert("Seja bem-vindo(a)! Você logou com sucesso.");
            });

        document
            .querySelector(".botao_criar")
            .addEventListener("click", function (event) {
                event.preventDefault();
                window.location.href = "cadastro.html";
            });

    </script>


</body>

</html>
