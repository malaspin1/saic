<!DOCTYPE html>
<html lang="pt_BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAIC - Cadastro</title>
    <link rel="stylesheet" href="/src/style/style.css">
    <link rel="icon" href="../img/saic.png?v=2" type="image/png">

</head>

<body>

    <header>

        <h1 id="logo">saic</h1>
        <ul>
            <li>Início</li>
            <li>Como funciona?</li>
            <li>Sobre</li>
        </ul>
        <div class="header_buttons_container">
            <button class="botao botao_entrar">Entrar</button>
            <button class="botao botao_criar">Criar conta</button>
        </div>
    </header>

    <form id="formulario_cadastro" class="formulario">
        <h2 class="titulo_form">Cadastro</h2>

        <label for="input_nome" class="input_label">Nome Completo:</label>
        <input minlength="2" maxlength="100" class="input-texto" type="text" name="nome" id="input_nome"
            placeholder="Insira seu nome completo aqui" required>

        <label for="input_cpf" class="input_cpf">CPF:</label>
        <input minlength="11" maxlength="11" class="input-texto" type="text" name="cpf" id="input_cpf"
            placeholder="Insira seu e-mail aqui" required>

        <label for="input_datanasc" class="input_label">Data de Nascimento:</label>
        <input class="input-texto" type="date" name="datanasc" id="input_datanasc" required>
        <a class="link_form" href="login.html">Ja possui uma conta? <strong>Clique aqui</strong> para entrar</a>
        <br>
        <input id="lembrardemim" type="checkbox" class="checkBox">
        <label for="lembrardemim" class="checkbox_label">Lembre de mim</label>
        <br>
        <button type="submit" id="submitcadastro" class="buttonConfirmar">Confirmar</button>
    </form>

    <script>
        document
            .getElementById("formulario_cadastro")
            .addEventListener("submit", function (event) {
                event.preventDefault();

                window.location.href = "cadastro2.html";
            });
        document
            .querySelector(".botao_entrar")
            .addEventListener("click", function (event) {
                event.preventDefault();
                window.location.href = "login.html";
            });
    </script>


</body>

</html>
