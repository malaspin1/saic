<!DOCTYPE html>
<html lang="pt_BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAIC - Cadastro Especialista</title>
    <link rel="stylesheet" href="../../style/formulario.css">

    <link rel="icon" href="../../img/saic.png?v=2" type="image/png">
</head>

<body>

    <header>
        <h1 id="logo">saic - <span class="tittle_span">Especialistas</span></h1>
        <ul>
            <li><a class="list_links" href="../pagina_inicial.html">Inicio</a></li>
            <li><a class="list_links" href="../cadastroUnidades_login/loginUnidades.html">Saic - Unidades</a></li>
            <li><a class="list_links" href="../cadastro_login/login.html">Saic - Pacientes</a></li>
        </ul>
    </header>

    <form id="formulario_cadastro" class="formulario">
        <h2 class="titulo_form">Cadastro</h2>

        <label for="input_email" class="input_label">Email:</label>
        <input minlength="5" maxlength="150" class="input-texto" type="email" name="email" id="input_email"
            placeholder="Insira seu email aqui" required>

        <label for="input_telefone" class="input_label">Telefone:</label>
        <input minlength="11" maxlength="11" class="input-texto" type="tel" name="telefone" id="input_telefone"
            placeholder="Insira seu telefone aqui" required>

        <label for="input_senha" class="input_label">Defina sua Senha:</label>
        <input class="input-texto" type="password" name="senha" id="input_senha" placeholder="Insira sua nova senha aqui" required>
        <a class="link_form" href="loginEspecialistas.html">Já possui uma conta? <strong>Clique aqui</strong> para entrar</a>
        <br>
        <input id="lembrardemim" type="checkbox" class="checkBox">
        <label for="lembrardemim" class="checkbox_label">Lembre de mim</label>
        <br>
        <button type="submit" id="submitcadastro" class="buttonConfirmar">Confirmar</button>
    </form>

    <script>
        document.querySelector("#logo").addEventListener("click", function (event) {
            event.preventDefault();
            window.location.href = "../pagina_inicial.html";
        });
        document.getElementById("formulario_cadastro").addEventListener("submit", function (event) {
            event.preventDefault();
            window.location.href = "cadastroEspecialistas3.html";
        });
    </script>

</body>

</html>
