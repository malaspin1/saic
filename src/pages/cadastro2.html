<!DOCTYPE html>
<html lang="pt_BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAIC - Cadastro</title>
    <link rel="stylesheet" href="/src/style/style.css">
    <link rel="icon" href="../img/saic.png?v=2" type="image/png">

    <!-- Importação da biblioteca de ícones Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>

    <header>

        <h1 id="logo">saic</h1>
        <ul>
            <li>Início</li>
            <li>Como funciona?</li>
            <li>Sobre</li>
        </ul>
        <div class="header_buttons_container">
            <button class="botao botao_entrar">Entrar</button>
            <button class="botao botao_criar">Criar conta</button>
        </div>
    </header>

    <form id="formulario_cadastro" class="formulario">
        <h2 class="titulo_form">Cadastro</h2>

        <label for="input_email" class="input_label">Email:</label>
        <input minlength="5" maxlength="150" class="input-texto" type="email" name="email" id="input_email"
            placeholder="Insira seu email aqui" required>

        <label for="input_telefone" class="input_label">Telefone:</label>
        <input minlength="11" maxlength="11" class="input-texto" type="tel" name="telefone" id="input_telefone"
            placeholder="Insira seu e-mail aqui" required>

        <label for="input_senha" class="input_label">Defina sua Senha:</label>
        <input class="input-texto" type="password" name="senha" id="input_senha" placeholder="Insira sua nova senha aqui" required>
        <a class="link_form" href="cadastro.html">Ja possui uma conta? <strong>Clique aqui</strong> para entrar</a>
        <br>
        <input id="lembrardemim" type="checkbox" class="checkBox">
        <label for="lembrardemim" class="checkbox_label">Lembre de mim</label>
        <br>
        <button type="submit" id="submitcadastro" class="buttonConfirmar">Confirmar</button>
    </form>

    <script>
       document
            .getElementById("formulario_cadastro")
            .addEventListener("submit", function (event) {
                event.preventDefault();

                window.location.href = "cadastro3.html";
            });
        document
            .querySelector(".botao_entrar")
            .addEventListener("click", function (event) {
                event.preventDefault();
                window.location.href = "login.html";
            }); 
    </script>


</body>

</html>
