<!DOCTYPE html>
<html lang="pt_BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAIC - Cadastro</title>
    <link rel="stylesheet" href="/src/style/style.css">
    <link rel="icon" href="../img/saic.png?v=2" type="image/png">

    <!-- Importação da biblioteca de ícones Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>

    <header>

        <h1 id="logo">saic</h1>
        <ul>
            <li>Início</li>
            <li>Como funciona?</li>
            <li>Sobre</li>
        </ul>
        <div class="header_buttons_container">
            <button class="botao botao_entrar">Entrar</button>
            <button class="botao botao_criar">Criar conta</button>
        </div>
    </header>

    <form style="text-align: center;" id="formulario_cadastro" class="formulario">
        <h2 class="titulo_form">Cadastro</h2>
        <label for="dig1" class="label_confirmacao">Confirmar E-Mail:
            <br>Insira o código de 5 digitos que enviamos ono seu E-mail</label>
        <br>
        <br>
        <br>
        <br>
        <input maxlength="1" minlength="1" class="input_digitos" id="dig1" type="text" placeholder="X">
        <input maxlength="1" minlength="1" class="input_digitos" id="dig2" type="text" placeholder="X">
        <input maxlength="1" minlength="1" class="input_digitos" id="dig3" type="text" placeholder="X">
        <input maxlength="1" minlength="1" class="input_digitos" id="dig4" type="text" placeholder="X">
        <input maxlength="1" minlength="1" class="input_digitos" id="dig5" type="text" placeholder="X">
        <br>
        <br>

        <button type="submit" id="submitcadastro" class="buttonConfirmar">Confirmar</button>
    </form>

    <script>
        document
            .getElementById("formulario_cadastro")
            .addEventListener("submit", function (event) {
                event.preventDefault();

                alert("Seja bem-vindo(a)! Você se cadastrou com sucesso.");
                window.location.href = "login.html";
            });
        document
            .querySelector(".botao_entrar")
            .addEventListener("click", function (event) {
                event.preventDefault();
                window.location.href = "login.html";
            });

        const inputs = document.querySelectorAll(".input_digitos"); //Lista com todos os inputs

        inputs.forEach((input, index) => { // Para todos os inputs

            // Percebe mudanças no input
            input.addEventListener("input", () => {
                if (input.value.length === 1 && index < inputs.length - 1) { // Se o input for preenchido e não for o ultimo
                    inputs[index + 1].focus(); // Foca no proximo input
                }
            });

            input.addEventListener("keydown", (event) => { // Caso alguma tecla for apertada
                if (
                    event.key === "Backspace" && // Verifica se é o backspace
                    input.value === "" && // Verifica se o valor do inputa atual é 0
                    index > 0 // Verifica se não é o primeiro
                ) {
                    inputs[index - 1].focus(); // Foca no anterior
                }
            });

        });
    </script>


</body>

</html>
