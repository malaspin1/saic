<!doctype html>
<html lang="pt_BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAIC - Painel do Paciente</title>
  <link rel="stylesheet" href="../../style/paineis.css" />
  <link rel="icon" href="../img/saic.png?v=2" type="image/png" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
  <!-- BARRA LATERAL -->
  <aside class="barra_lateral">
    <h1>saic</h1>
    <nav>
      <ul>
        <li>
          <button onclick="trocarPagina('inicio')" href="#"><i class="fa-solid fa-house"></i> Início</button>
        </li>
        <li>
          <button onclick="trocarPagina('consultas_marc')" href="painel_paciente2.html"><i
              class="fa-regular fa-calendar-check"></i> Consultas
            Marcadas</button>
        </li>
        <li class="ativo">
          <button href="#"><i class="fa-regular fa-clock"></i> Histórico de
            Consultas</button>
        </li>
        <li>
          <button onclick="trocarPagina('buscar_med')" href="#"><i class="fa-solid fa-magnifying-glass"></i> Buscar
            Médicos</button>
        </li>
        <li>
          <button onclick="trocarPagina('perfil')" href="#"><i class="fa-regular fa-user"></i> Perfil</button>
        </li>
        <li class="divisor"></li>
        <li>
          <button onclick="sair()" href="pagina_inicial.html"><i class="fa-solid fa-arrow-right-from-bracket"></i>
            Sair</button>
        </li>
      </ul>
    </nav>
  </aside>

  <!-- CONTEÚDO PRINCIPAL -->
  <main>
    <header>
      <div>
        <h1>Olá, Miguel!</h1>
        <p>Busque Médicos para agendar consultas</p>
      </div>

      <div class="perfil_usuario">
        <span class="avatar">M</span>
        <div>
          <strong>Miguel Silva</strong>
          <small>Paciente</small>
        </div>
      </div>
    </header>

    <section class="busca_medico">
      <div class="area_busca">
        <h3>Buscar</h3>
        <div class="input_busca">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input class="bucar_medico_input" type="text" placeholder="Buscar médico...">
        </div>
        <i class="filtros_botao fa-solid fa-sort-down" onclick="filtros()"></i>
      </div>
      <div class="medicos">
        <div class="medico">
          <div class="infos_medico">
            <img src="../../img/foto_medico.png" alt="Foto da médica">
            <span>
              <h4>Dra. Ana Costa</h4>
              <p>Dermatologia</p>
            </span>
          </div>
          <button class="agendar_button">
            Agendar Consulta
          </button>
        </div>

        <div class="medico">
          <div class="infos_medico">
            <img src="../../img/foto_medico.png" alt="Foto do médico">
            <span>
              <h4>Dr. Paulo Santos</h4>
              <p>Ortopedia</p>
            </span>
          </div>
          <button class="agendar_button">
            Agendar Consulta
          </button>
        </div>

        <div class="medico">
          <div class="infos_medico">
            <img src="../../img/foto_medico.png" alt="Foto do médico">
            <span>
              <h4>Dr. João T.</h4>
              <p>Oftalmologia</p>
            </span>
          </div>
          <button class="agendar_button">
            Agendar Consulta
          </button>
        </div>

        <div class="medico">
          <div class="infos_medico">
            <img src="../../img/foto_medico.png" alt="Foto da médica">
            <span>
              <h4>Dra. Rafaela</h4>
              <p>Dermatologia</p>
            </span>
          </div>
          <button class="agendar_button">
            Agendar Consulta
          </button>
        </div>
      </div>
    </section>

  </main>

  <script src="../../scripts/paineis.js"></script>
  <script src="../../scripts/busca_medico.js"></script>
</body>

</html>
