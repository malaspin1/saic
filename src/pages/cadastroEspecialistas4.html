<!DOCTYPE html>
<html lang="pt_BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAIC - Cadastro</title>
    <link rel="stylesheet" href="../style/style.css">
    <link rel="icon" href="../img/saic.png?v=2" type="image/png">

</head>

<body>

    <header>

        <h1 id="logo">saic - <span class="tittle_span">Especialistas</span></h1>
        <ul>
            <li>Início</li>
            <li><a class="list_links" href="loginUnidades.html">Saic - Unidades</a></li>
            <li><a class="list_links" href="login.html">Saic - Pacientes</a></li>
            <li>Sobre</li>
        </ul>
    </header>

    <form style="text-align: center;" id="formulario_cadastro" class="formulario">
        <h2 class="titulo_form">Cadastro</h2>
        <label for="dig1" class="label_confirmacao">Insira seu CRM:
            <br>Este é o campo para informar o número do seu CRM. <br> Digite o registro profissional para
            continuar.</label>
        <br>
        <br>
        <input class="input-texto" id="crm" type="text" placeholder="Insira seu CRM aqui">
        <br>
        <br>

        <button type="submit" id="submitcadastro" class="buttonConfirmar">Confirmar</button>
    </form>

    <script>
        document
            .getElementById("formulario_cadastro")
            .addEventListener("submit", function (event) {
                event.preventDefault();

                alert("Seja bem-vindo(a)! Você se cadastrou com sucesso.");
                window.location.href = "loginEspecialistas.html";
            });
    </script>


</body>

</html>
