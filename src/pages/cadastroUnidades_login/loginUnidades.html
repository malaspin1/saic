<!DOCTYPE html>
<html lang="pt_BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAIC - Login Unidades</title>
    <link rel="stylesheet" href="../../style/formulario.css">
    
    <link rel="icon" href="../../img/saic.png?v=2" type="image/png" />
</head>

<body>

    <header>
        <h1 id="logo">saic - <span class="tittle_span">Unidades</span></h1>
        <ul>
            <li><a class="list_links" href="../pagina_inicial.html">Inicio</a></li>
            <li><a class="list_links" href="../cadastroEspecialista_login/loginEspecialistas.html">Saic - Especialistas</a></li>
            <li><a class="list_links" href="../cadastro_login/login.html">Saic - Pacientes</a></li>
        </ul>
    </header>

    <form id="formulario_login" class="formulario">
        <h2 class="titulo_form">Login</h2>

        <label for="input_email" class="input_label">E-mail / Código da Unidade:</label>
        <input minlength="5" maxlength="150" class="input-texto" type="text" name="unidade_login" id="input_email"
            placeholder="Insira seu login de unidade aqui" required />

        <label for="input_senha" class="input_label">Senha:</label>
        <input minlength="8" maxlength="50" class="input-texto" type="password" name="senha" id="input_senha"
            placeholder="Digite sua senha" required />
        <a class="link_form" href="cadastroUnidades.html">Não tem conta? <strong>Clique aqui</strong> para criar</a>
        <br />
        <input id="lembrardemim" type="checkbox" class="checkBox" />
        <label for="lembrardemim" class="checkbox_label">Lembre de mim</label>
        <br />
        <button type="submit" class="buttonConfirmar">Confirmar</button>
    </form>

    <script>
        document.getElementById("formulario_login").addEventListener("submit", function (event) {
            event.preventDefault();
            window.location.href = "../pagina_inicial_unidade.html";
        });

        document.querySelector("#logo").addEventListener("click", function (event) {
            event.preventDefault();
            window.location.href = "../pagina_inicial.html";
        });
    </script>

</body>

</html>
