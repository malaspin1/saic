<!DOCTYPE html>
<html lang="pt_BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAIC - Cadastro Unidades</title>
    <link rel="stylesheet" href="../../style/formulario.css">

    <link rel="icon" href="../../img/saic.png?v=2" type="image/png" />
</head>

<body>

    <header>
        <h1 id="logo">saic - <span class="tittle_span">Unidades</span></h1>
        <ul>
            <li><a class="list_links" href="../pagina_inicial.html">Inicio</a></li>
            <li><a class="list_links" href="../cadastroEspecialista_login/loginEspecialistas.html">Saic - Especialistas</a></li>
            <li><a class="list_links" href="../cadastro_login/login.html">Saic - Pacientes</a></li>
        </ul>
    </header>

    <form id="formulario_cadastro" class="formulario">
        <h2 class="titulo_form">Cadastro</h2>

        <label for="input_estado" class="input_label">Estado:</label>
        <input minlength="2" maxlength="150" class="input-texto" type="text" name="estado" id="input_estado"
            placeholder="Insira seu estado aqui" required />

        <label for="input_cidade" class="input_label">Cidade:</label>
        <input minlength="2" maxlength="50" class="input-texto" type="text" name="cidade" id="input_cidade"
            placeholder="Insira sua cidade aqui" required />

        <label for="input_bairro" class="input_label">Bairro:</label>
        <input minlength="2" maxlength="50" class="input-texto" type="text" name="bairro" id="input_bairro"
            placeholder="Insira o seu bairro aqui" required />

        <a class="link_form" href="loginUnidades.html">Já possui uma conta? <strong>Clique aqui</strong> para entrar</a>
        <br>
        <button type="submit" class="buttonConfirmar">Continuar</button>
    </form>

    <script>
        document.getElementById("formulario_cadastro").addEventListener("submit", function (event) {
            event.preventDefault();
            window.location.href = "cadastroUnidades3.html";
        });

        document.querySelector("#logo").addEventListener("click", function (event) {
            event.preventDefault();
            window.location.href = "../pagina_inicial.html";
        });
    </script>

</body>

</html>
