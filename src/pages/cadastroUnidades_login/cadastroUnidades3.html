<!DOCTYPE html>
<html lang="pt_BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAIC - Cadastro Unidades</title>
    <link rel="stylesheet" href="../../style/formulario.css">

    <link rel="icon" href="../../img/saic.png?v=2" type="image/png" />
</head>

<body>

    <header>
        <h1 id="logo">saic - <span class="tittle_span">Unidades</span></h1>
        <ul>
            <li><a class="list_links" href="../pagina_inicial.html">Inicio</a></li>
            <li><a class="list_links" href="../cadastroEspecialista_login/loginEspecialistas.html">Saic - Especialistas</a></li>
            <li><a class="list_links" href="../cadastro_login/login.html">Saic - Pacientes</a></li>
        </ul>
    </header>

    <form id="formulario_cadastro" class="formulario">
        <h2 class="titulo_form">Cadastro</h2>

        <label for="input_complemento" class="input_label">Complemento:</label>
        <input minlength="2" maxlength="150" class="input-texto" type="text" name="complemento" id="input_complemento"
            placeholder="Insira seu complemento aqui" />

        <label for="input_logradouro" class="input_label">Logradouro:</label>
        <input minlength="2" maxlength="150" class="input-texto" type="text" name="logradouro" id="input_logradouro"
            placeholder="Insira seu logradouro aqui" required />

        <label for="input_numero" class="input_label">Número:</label>
        <input minlength="1" maxlength="20" class="input-texto" type="text" name="numero" id="input_numero"
            placeholder="Insira o número aqui" required />

        <a class="link_form" href="loginUnidades.html">Já possui uma conta? <strong>Clique aqui</strong> para entrar</a>
        <br>
        <button type="submit" class="buttonConfirmar">Finalizar Cadastro</button>
    </form>

    <script>
        document.getElementById("formulario_cadastro").addEventListener("submit", function (event) {
            event.preventDefault();
            alert("Unidade cadastrada com sucesso!");
            window.location.href = "../pagina_inicial_unidade.html";
        });

        document.querySelector("#logo").addEventListener("click", function (event) {
            event.preventDefault();
            window.location.href = "../pagina_inicial.html";
        });
    </script>

</body>

</html>
